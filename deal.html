<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Deal — Dealflow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%231A2420'/><rect x='22' y='24' width='10' height='52' fill='%232B8A78'/><rect x='45' y='24' width='33' height='9' fill='%23F2F3F1'/><rect x='45' y='45' width='33' height='9' fill='%23F2F3F1'/><rect x='45' y='66' width='23' height='9' fill='%23F2F3F1'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="back-link">← Pipeline</a>
    <div class="wordmark"><span class="firm-name">Firm</span> · Dealflow</div>
  </header>

  <main class="deal-shell hidden" id="deal-shell">
    <div class="deal-card">
      <div class="panel-head">
        <div>
          <h2 id="panel-title">New deal</h2>
          <p id="panel-id" class="mono"></p>
        </div>
      </div>

      <div class="panel-body">
        <label>Company <input id="f-company" type="text" autocomplete="off"></label>
        <label>One-liner <input id="f-oneliner" type="text" placeholder="What they do, in a sentence" autocomplete="off"></label>
        <label>Founders <input id="f-founders" type="text" placeholder="Names, roles" autocomplete="off"></label>

        <div class="field-row">
          <label>Status <select id="f-status"></select></label>
          <label>Sector <input id="f-sector" type="text" autocomplete="off"></label>
        </div>
        <div class="field-row">
          <label>Source <input id="f-source" type="text" placeholder="How it reached us" autocomplete="off"></label>
          <label>Owner <input id="f-owner" type="text" autocomplete="off"></label>
        </div>

        <label>Notes <textarea id="f-notes" rows="5"></textarea></label>
        <label>Open questions <textarea id="f-questions" rows="4" placeholder="What we still need to find out"></textarea></label>
      </div>

      <div class="panel-foot">
        <button id="archive-btn" class="btn hidden">Archive deal</button>
        <button id="save-btn" class="btn primary">Save</button>
      </div>
    </div>
  </main>

  <div id="toast" class="hidden" role="status"></div>
  <div id="loading" class="hidden"><span class="spinner"></span><span id="loading-label">Loading…</span></div>

  <script src="config.js"></script>
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="vendor/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>
  <script src="store.js"></script>
  <script src="common.js"></script>
  <script src="deal.js"></script>
</body>
</html>
